<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顧客管理システム</title>
</head>
<body>
    <h1>顧客管理システム</h1>
    <p><a th:href="@{/admin/customers}">顧客一覧へ戻る</a></p>
    
    <h2>顧客詳細</h2>
    <table>
        <tr>
            <th>ID</th>
            <td th:text="${customer.id}"></td>
        </tr>
        <tr>
            <th>氏名</th>
            <td th:text="${customer.name} + ' 様'"></td>
        </tr>
		<tr>
			<th>生年月日</th>
	        <td th:text="${customer.formattedBirthDateAndAge}"></td>
        </tr>
        <tr>
            <th>電話番号</th>
            <td th:text="${customer.phoneNumber}"></td>
        </tr>
        <tr>
            <th>メールアドレス</th>
            <td th:text="${customer.email}"></td>
        </tr>
    </table>

<!--    <p><a th:href="@{/admin/customers/edit/{id}(id=${customer.id})}">顧客情報を編集する</a></p>-->
    
</body>
</html>
