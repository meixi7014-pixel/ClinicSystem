<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顧客管理システム</title>
</head>
<body>
    <h1>顧客管理システム</h1>
    <p><a th:href="@{/admin}">顧客管理システムTOPへ戻る</a></p>
    
    <h2>顧客一覧</h2>
    <table>
        <thead>
            <tr>
                <th>顧客ID</th>
                <th>顧客名</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="customer : ${customers}">
                <td th:text="${customer.id}">1</td>
                <td th:text="${customer.name}">高巻杏</td>
                <td><a href="">顧客詳細</a></td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
