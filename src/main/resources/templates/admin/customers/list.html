<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
	<head>
	    <th:block th:replace="~{admin/common :: common-head}"></th:block>
	    
	    <title>顧客一覧 | クリニック管理システム</title>
	</head>
<body>    
    <div th:replace="~{admin/common :: common-header(null, null, '顧客一覧・検索')}"></div>

    <h2>顧客一覧・検索</h2>

    <div class="search-form">
        <form th:action="@{/admin/customers}" method="get">
            <input type="number" name="searchId" th:value="${searchId}" placeholder="ID (完全一致)">
            <input type="text" name="searchName" th:value="${searchName}" placeholder="氏名 (部分一致)">
            <input type="text" name="searchPhone" th:value="${searchPhone}" placeholder="電話番号 (部分一致)">
            <input type="text" name="searchEmail" th:value="${searchEmail}" placeholder="メールアドレス (部分一致)">
            <button type="submit">検索</button>
            <a th:href="@{/admin/customers}" class="clear-link">クリア</a>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>氏名</th>
                <th>電話番号</th>
                <th>メールアドレス</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="customer : ${customers}">
                <td th:text="${customer.id}"></td>
                <td th:text="${customer.name} + ' 様'"></td>
                <td th:text="${customer.phoneNumber}"></td>
                <td th:text="${customer.email}"></td>
                <td><a th:href="@{/admin/customers/{id}(id=${customer.id})}">顧客詳細</a></td>
            </tr>
        </tbody>
    </table>
	
    <ul class="pagination" th:if="${totalPages > 1}">
        <li th:classappend="${currentPage == 1} ? 'disabled'">
            <span th:if="${currentPage == 1}">◀ 前へ</span>
            <a th:if="${currentPage > 1}" th:href="@{/admin/customers(page=${currentPage - 1}, searchId=${searchId}, searchName=${searchName}, searchPhone=${searchPhone}, searchEmail=${searchEmail})}">◀ 前へ</a>
        </li>

        <li th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${i == currentPage} ? 'active'">
            <span th:if="${i == currentPage}" th:text="${i}"></span>
            <a th:if="${i != currentPage}" th:href="@{/admin/customers(page=${i}, searchId=${searchId}, searchName=${searchName}, searchPhone=${searchPhone}, searchEmail=${searchEmail})}" th:text="${i}"></a>
        </li>

        <li th:classappend="${currentPage == totalPages} ? 'disabled'">
            <span th:if="${currentPage == totalPages}">次へ ▶</span>
            <a th:if="${currentPage < totalPages}" th:href="@{/admin/customers(page=${currentPage + 1}, searchId=${searchId}, searchName=${searchName}, searchPhone=${searchPhone}, searchEmail=${searchEmail})}">次へ ▶</a>
        </li>
    </ul>
	
    <div th:replace="~{admin/common :: common-logout}"></div>
    
</body>
</html>
