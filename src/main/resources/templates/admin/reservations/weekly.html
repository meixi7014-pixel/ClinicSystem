<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
     <th:block th:replace="~{admin/common :: common-head}"></th:block>
    <div th:replace="~{admin/common :: common-header(null, null, '週間予約スケジュール')}"></div>
    <title>予約状況 | クリニック管理システム</title>
</head>
<body>
    <h2>カウンセリング予約状況</h2>
    <div class="subtitle" id="week-range">対象期間：計算中...</div>

    <div class="calendar-nav">
        <a th:href="@{/admin/reservations/weekly(date=${prevWeek})}" class="nav-btn">◀ 前の週</a>
        <a th:href="@{/admin/reservations/weekly}" class="nav-btn">今週</a>
        <a th:href="@{/admin/reservations/weekly(date=${nextWeek})}" class="nav-btn">次の週 ▶</a>
    </div>

    <table class="calendar-table">
        <thead>
            <tr>
                <th>時間</th>
                <th id="th-0">日</th>
                <th id="th-1">月</th>
                <th id="th-2">火</th>
                <th id="th-3">水</th>
                <th id="th-4">木</th>
                <th id="th-5">金</th>
                <th id="th-6">土</th>
            </tr>
        </thead>
        <tbody id="calendar-body">
        </tbody>
    </table>
	
    <div th:replace="~{admin/common :: common-logout}"></div>

    <script th:inline="javascript">
        const jsonString = /*[[${jsonCounts}]]*/ '[]';
        const dbReservationCounts = JSON.parse(jsonString);
        const baseDateParam = /*[[${baseDateStr}]]*/ null;
    </script>

    <script>
        let sunday;
        if (baseDateParam) {
            const year = parseInt(baseDateParam.substring(0, 4));
            const month = parseInt(baseDateParam.substring(4, 6)) - 1;
            const day = parseInt(baseDateParam.substring(6, 8));
            sunday = new Date(year, month, day);
        } else {
            const today = new Date();
            const currentDay = today.getDay();
            sunday = new Date(today);
            sunday.setDate(today.getDate() - currentDay);
        }

        const saturday = new Date(sunday);
        saturday.setDate(sunday.getDate() + 6);
        document.getElementById('week-range').textContent = `対象期間：${sunday.getMonth() + 1}/${sunday.getDate()}（日）～ ${saturday.getMonth() + 1}/${saturday.getDate()}（土）`;
        
        const dateStrings = [];
        const weekLabels = ['日', '月', '火', '水', '木', '金', '土'];
        
        for (let i = 0; i < 7; i++) {
            const targetDate = new Date(sunday);
            targetDate.setDate(sunday.getDate() + i);
            
            const yyyy = targetDate.getFullYear();
            const mm = String(targetDate.getMonth() + 1).padStart(2, '0');
            const dd = String(targetDate.getDate()).padStart(2, '0');
            dateStrings.push(`${yyyy}${mm}${dd}`);
            
            const th = document.getElementById(`th-${i}`);
            th.innerHTML = `${targetDate.getMonth() + 1}/${targetDate.getDate()}<br><span class="day-${i}">${weekLabels[i]}</span>`;
        }

        const startHour = 10;
        const endHour = 19;
        const calendarBody = document.getElementById('calendar-body');

        for (let hour = startHour; hour <= endHour; hour++) {
            const row = document.createElement('tr');
            
            const timeTd = document.createElement('td');
            timeTd.className = 'time-col';
            timeTd.textContent = `${hour}:00`;
            row.appendChild(timeTd);

            for (let day = 0; day < 7; day++) {
                const cell = document.createElement('td');
                const targetDateStr = dateStrings[day];

                const matchData = dbReservationCounts.find(data => 
                    data.reserveDate === targetDateStr && parseInt(data.reserveHour) === hour
                );
                const count = matchData ? parseInt(matchData.reservationCount) : 0;

                if (count > 0) {
                    cell.innerHTML = `<a href="/admin/reservations/detail/${targetDateStr}" class="status available">${count}</a>`;
                } else {
                    cell.innerHTML = `<span class="status booked">0</span>`;
                }
                
                row.appendChild(cell);
            }

            calendarBody.appendChild(row);
        }
    </script>

</body>
</html>
