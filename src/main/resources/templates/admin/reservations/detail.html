<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
     <th:block th:replace="~{admin/common :: common-head}"></th:block>
    <div th:replace="~{admin/common :: common-header('/admin/reservations/weekly', '週間予約スケジュール', '予約一覧')}"></div>
    <title>予約詳細一覧 | クリニック管理システム</title>
</head>
<body>
    
    <h2 th:text="${formattedDate} + ' の予約詳細一覧'">2026年6月20日 の予約詳細一覧</h2>

    <div th:if="${#lists.isEmpty(reservations)}" class="no-data">
        この日の予約はありません。
    </div>

    <div th:unless="${#lists.isEmpty(reservations)}" th:each="res : ${reservations}" class="card">
        <table class="reservation-table">
            <tr>
                <th>予約ID</th>
                <td th:text="${res.id}">1</td>
            </tr>
            <tr>
                <th>クリニック</th>
                <td>新宿院</td>
            </tr>
            <tr>
                <th>来院日時</th>
                <td th:text="${formattedDate} + ' '+${res.reserveTime} + ' ～（1時間）'"></td>
            </tr>
            <tr>
                <th>顧客ID</th>
                <td th:text="${res.customerId}"></td>
            </tr>
            <tr>
                <th>氏名</th>
                <td>
                    <a th:href="@{/admin/customers/{id}(id=${res.customerId})}"
                       th:text="${res.customerName} + ' 様'" target="_blank">
                    </a>
                </td>
            </tr>
        </table>
<!--        <p><a th:href="@{/admin/reservations/cancel/{id}(id=${res.id})}" class="cancel-btn">この予約をキャンセルする</a></p>-->
    </div>
	
    <div th:replace="~{admin/common :: common-logout}"></div>
    
</body>
</html>
