<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta th:fragment="common-head" charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/admin/style.css}">
</head>
<body>

    <header th:fragment="common-header(parentUrl, parentText, currentText)" class="global-header" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: #fff; border-bottom: 1px solid #e0e0e0;">
        
        <div>
            <h1 style="margin: 0; font-size: 1.5rem;"><a th:href="@{/admin}" style="text-decoration: none; color: #007bbb;">クリニック管理システム</a></h1>
            
            <nav class="breadcrumb" th:if="${currentText != '管理メニューTOP'}" style="font-size: 0.85rem; margin-top: 5px; color: #666;">
                <a th:href="@{/admin}">管理メニューTOP</a>
                <span th:if="${parentUrl != null}">
                    &gt; <a th:href="@{${parentUrl}}" th:text="${parentText}"></a>
                </span>
                <span th:if="${currentText != null}">
                    &gt; <span th:text="${currentText}"></span>
                </span>
            </nav>
        </div>

        <div class="login-user-info" th:if="${session.loginAdmin != null}" style="font-size: 0.9rem; color: #444; font-weight: bold; background-color: #f5f5f5; padding: 6px 12px; border-radius: 4px; border: 1px solid #e0e0e0;">
            👤 ログイン中：<span th:text="${session.loginAdmin.name}" style="color: #007bbb;"></span>
        </div>
        
    </header>

    <div th:fragment="common-logout" class="logout-area" style="margin-top: 40px; margin-bottom: 20px;">
        <form th:action="@{/admin/logout}" method="post">
            <button type="submit" class="btn-logout">🔑 ログアウト</button>
        </form>
    </div>

</body>
</html>
