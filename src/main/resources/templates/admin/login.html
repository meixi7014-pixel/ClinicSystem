<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | クリニック管理システム</title>
    <link rel="stylesheet" th:href="@{/css/admin/style.css}">
</head>
<body class="login-page">
    <h1 class="page-title">クリニック管理システム</h1>
    <h2>ログイン</h2>
    
    <p th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></p>

    <form th:action="@{/admin/login}" method="post">
        <p>
            管理者ID<br> 
            <input type="text" name="adminId" id="adminId" th:value="${typedId}">
        </p>
        <p>
            ログインパスワード<br> 
            <input type="password" name="password" id="password">
        </p>
        <p>
            <button type="submit" id="submitBtn" disabled>ログイン</button>
        </p>
    </form>

    <script>
        const adminIdInput = document.getElementById('adminId');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');

        function toggleButtonState() {
            const adminIdValue = adminIdInput.value.trim();
            const passwordValue = passwordInput.value.trim();

            if (adminIdValue !== "" && passwordValue !== "") {
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
        }

        adminIdInput.addEventListener('input', toggleButtonState);
        passwordInput.addEventListener('input', toggleButtonState);
        window.addEventListener('DOMContentLoaded', toggleButtonState);
    </script>
</body>
</html>
