<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無料カウンセリング予約フォーム</title>
</head>
<body>
    <h1>無料カウンセリング予約フォーム</h1>
    <p>ご希望のクリニック：新宿院</p>
    <p>ご希望の日程：2026年06月26日</p>
    <p>ご希望の時間：14:00～（1時間）</p>


    <h2>お名前</h2>
    <input type="text" required placeholder="佐藤花子">
    <h2>生年月日</h2>
    <input type="number" required placeholder="19950626">
    <h2>電話番号</h2>
    <input type="tel" required placeholder="09012345678">
    <h2>メールアドレス</h2>
    <input type="email" required placeholder="example@mail.com">

    <p><input type="submit" value="確認画面へ進む"></p>
    <p><a href="reservation.html">ご予約日程を再選択する</a></p>

</body>
</html>
